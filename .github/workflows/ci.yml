# CI
# --
# Continuous integration pipeline. Runs on push to main and pull
# requests. A scope job (jflowers/ship's pr-scope.yml) decides whether
# the expensive jobs run: chore pull requests -- Dewey learnings and
# gh-hud toolkit rollouts -- skip them and get a gitleaks scan instead;
# pushes to main always run everything. Validates code quality (vet,
# govulncheck), runs tests with race detection, enforces per-package
# coverage ratchets, verifies the binary builds, and runs the org's
# Standardized CI (MegaLinter, PR title validation, pinact). The CI OK
# aggregate is the only required check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # code == 'false' only for pull requests whose files are all Dewey
  # learnings, or a gh-hud toolkit rollout; 'true' for everything else.
  scope:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # main, after v0.11.0
    permissions:
      contents: read

  build-and-test:
    name: Build and Test
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@3e6f44f962742443c11ae2261f02e0c917aeb2bc  # v1.5.0
          govulncheck ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          install-only: true
          distribution: goreleaser
          version: v2.18.2

      - name: Render Homebrew cask
        run: goreleaser release --snapshot --clean --skip=announce

      - name: Test Homebrew cask integrity patching
        run: .github/scripts/patch-homebrew-cask_test.sh dist/homebrew/Casks/replicator.rb

      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Enforce Coverage Ratchets
        run: |
          # Guard: coverage profile must exist and be non-empty
          if [ ! -s coverage.out ]; then
            echo "::error::No coverage profile found — cannot enforce ratchets"
            exit 1
          fi

          FAILED=0

          # --- Global coverage floor ---
          GLOBAL_COV=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print substr($3, 1, length($3)-1)}')
          if [ -z "$GLOBAL_COV" ]; then
            echo "::error::Could not parse global coverage from coverage.out"
            exit 1
          fi
          echo "Global coverage: ${GLOBAL_COV}%"
          if (( $(echo "$GLOBAL_COV < 55.0" | bc -l) )); then
            echo "::error::Global coverage ${GLOBAL_COV}% is below the 55% threshold."
            exit 1
          fi

          # --- Per-package coverage ratchets ---
          declare -A THRESHOLDS=(
            ["internal/memory"]=85
            ["internal/query"]=80
            ["internal/doctor"]=80
            ["internal/forge"]=80
            ["internal/stats"]=80
            ["internal/comms"]=80
            ["internal/org"]=80
            ["internal/agentkit"]=80
            ["internal/gitutil"]=80
            ["internal/ui"]=75
            ["internal/mcp"]=70
            ["internal/mcpclient"]=80
          )

          for PKG in "${!THRESHOLDS[@]}"; do
            THRESHOLD=${THRESHOLDS[$PKG]}
            PKG_COV=$(go tool cover -func=coverage.out \
              | grep "github.com/unbound-force/replicator/${PKG}" \
              | awk '{print substr($3, 1, length($3)-1)}' \
              | awk '{t+=$1; c++} END {if(c>0) printf "%.1f", t/c; else print "0.0"}')
            if (( $(echo "$PKG_COV < $THRESHOLD" | bc -l) )); then
              echo "::error::${PKG} coverage ${PKG_COV}% is below the ${THRESHOLD}% threshold."
              FAILED=1
            else
              echo "${PKG}: ${PKG_COV}% >= ${THRESHOLD}% ✓"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All coverage ratchets passed."

      - name: Build
        run: go build -o bin/replicator ./cmd/replicator

  # The org's reusable CI: MegaLinter ("Run linters", which includes
  # betterleaks and KICS), PR title validation and pinact. It lives in
  # this workflow so CI OK can need it; its check names are unchanged.
  call-reusable-ci:
    name: Standardized CI
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    uses: complytime/org-infra/.github/workflows/reusable_ci.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a  # v0.9.0
    permissions:
      contents: read
      issues: read
      pull-requests: read

  # Chore PRs skip Standardized CI, and with it the secret scan: scan
  # their commits here instead, since learnings can carry leaked secrets.
  gitleaks:
    name: Gitleaks
    needs: [scope]
    if: needs.scope.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # HEAD is the PR merge commit: HEAD^1 is main, HEAD^2 the PR head.
      - name: Scan the pull request's commits
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='HEAD^1..HEAD^2' \
            --redact --verbose --no-banner

  ci-ok:
    name: CI OK
    needs: [scope, build-and-test, call-reusable-ci, gitleaks]
    # Always run, so a failed or cancelled job fails the check -- except
    # for a push run that was itself cancelled (superseded by a newer
    # push to main). That run is not a verdict, so the check is skipped
    # instead of leaving a red CI OK on main's history. Pull request runs
    # never skip it: a skipped job satisfies a required check, so a
    # cancelled PR run must fail.
    if: always() && !(github.event_name == 'push' && cancelled())
    runs-on: ubuntu-latest
    steps:
      # The verdict is plain shell over the needed jobs' results, so
      # ci_gating_test.go can run it against every combination. It passes
      # only when scope succeeded and the jobs it chose concluded as
      # chosen: Build and Test and Standardized CI for code (gitleaks
      # skipped), gitleaks for chores (the others skipped).
      - name: Check needed job results
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          BUILD: ${{ needs.build-and-test.result }}
          LINT: ${{ needs.call-reusable-ci.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
        run: |
          echo "scope=$SCOPE code=$CODE build-and-test=$BUILD call-reusable-ci=$LINT gitleaks=$GITLEAKS"
          if [ "$SCOPE" != "success" ]; then
            echo "::error::scope ended '$SCOPE' — CI did not pass."
            exit 1
          fi
          case "$CODE" in
            true) want_code=success want_chore=skipped ;;
            false) want_code=skipped want_chore=success ;;
            *)
              echo "::error::scope code output '$CODE' — CI did not pass."
              exit 1
              ;;
          esac
          fail=0
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 ended '${2:-<none>}', want '$3' — CI did not pass."
              fail=1
            fi
          }
          expect build-and-test "$BUILD" "$want_code"
          expect call-reusable-ci "$LINT" "$want_code"
          expect gitleaks "$GITLEAKS" "$want_chore"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All needed jobs ended as scope chose."
