# CI
# --
# Continuous integration pipeline. Runs on push to main and
# pull requests. A changes job detects whether a pull request
# touches files outside .uf/dewey/learnings/ and gates the
# expensive jobs; pushes to main always run everything. The
# CI OK aggregate fails when any needed job fails or is
# cancelled. Validates code quality (vet, govulncheck), runs
# tests with race detection, enforces per-package coverage
# ratchets, and verifies the binary builds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect code changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes to main always run full CI (CLS-FR-001).
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Push event — setting code=true unconditionally."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail closed: a failed diff fails the job rather than guessing.
          if ! CHANGED_FILES="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"; then
            echo "::error::git diff against the pull request base failed — failing closed (CLS-FR-001)"
            exit 1
          fi

          # --no-renames disables rename detection so a file moved into
          # .uf/dewey/learnings/ still counts its source path as a change
          # outside learnings.
          code="false"
          while IFS= read -r file; do
            case "$file" in
              ""|.uf/dewey/learnings/*) ;;
              *)
                code="true"
                break
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$code" = "true" ]; then
            echo "Changed files outside .uf/dewey/learnings/ — full CI required."
          else
            echo "All changed files are under .uf/dewey/learnings/ — expensive jobs may skip."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@3e6f44f962742443c11ae2261f02e0c917aeb2bc  # v1.5.0
          govulncheck ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          install-only: true
          distribution: goreleaser
          version: v2.18.2

      - name: Render Homebrew cask
        run: goreleaser release --snapshot --clean --skip=announce

      - name: Test Homebrew cask integrity patching
        run: .github/scripts/patch-homebrew-cask_test.sh dist/homebrew/Casks/replicator.rb

      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Enforce Coverage Ratchets
        run: |
          # Guard: coverage profile must exist and be non-empty
          if [ ! -s coverage.out ]; then
            echo "::error::No coverage profile found — cannot enforce ratchets"
            exit 1
          fi

          FAILED=0

          # --- Global coverage floor ---
          GLOBAL_COV=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print substr($3, 1, length($3)-1)}')
          if [ -z "$GLOBAL_COV" ]; then
            echo "::error::Could not parse global coverage from coverage.out"
            exit 1
          fi
          echo "Global coverage: ${GLOBAL_COV}%"
          if (( $(echo "$GLOBAL_COV < 55.0" | bc -l) )); then
            echo "::error::Global coverage ${GLOBAL_COV}% is below the 55% threshold."
            exit 1
          fi

          # --- Per-package coverage ratchets ---
          declare -A THRESHOLDS=(
            ["internal/memory"]=85
            ["internal/query"]=80
            ["internal/doctor"]=80
            ["internal/forge"]=80
            ["internal/stats"]=80
            ["internal/comms"]=80
            ["internal/org"]=80
            ["internal/agentkit"]=80
            ["internal/gitutil"]=80
            ["internal/ui"]=75
            ["internal/mcp"]=70
            ["internal/mcpclient"]=80
          )

          for PKG in "${!THRESHOLDS[@]}"; do
            THRESHOLD=${THRESHOLDS[$PKG]}
            PKG_COV=$(go tool cover -func=coverage.out \
              | grep "github.com/unbound-force/replicator/${PKG}" \
              | awk '{print substr($3, 1, length($3)-1)}' \
              | awk '{t+=$1; c++} END {if(c>0) printf "%.1f", t/c; else print "0.0"}')
            if (( $(echo "$PKG_COV < $THRESHOLD" | bc -l) )); then
              echo "::error::${PKG} coverage ${PKG_COV}% is below the ${THRESHOLD}% threshold."
              FAILED=1
            else
              echo "${PKG}: ${PKG_COV}% >= ${THRESHOLD}% ✓"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All coverage ratchets passed."

      - name: Build
        run: go build -o bin/replicator ./cmd/replicator

  ci-ok:
    name: CI OK
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A needed job failed or was cancelled — CI did not pass."
          exit 1

      - name: All needed jobs succeeded or were skipped
        run: echo "All needed jobs succeeded or were skipped."
