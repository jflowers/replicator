# Release
# =======
# One-click release via workflow_dispatch. The pipeline itself lives in
# jflowers/ship's go-release.yml, shared with the other unbound-force Go
# tools: a settings check (signing needs all of the MACOS_* secrets or
# none; a partial set fails before anything is tagged), org-infra
# preflight (semver, tag uniqueness, CI on HEAD, unreleased commits,
# annotated tag), GoReleaser with cosign and SBOMs, Developer ID signing
# + notarization of the darwin archives, then the cask (every sha256 from
# the final checksums.txt) checked with brew audit and pushed to
# unbound-force/homebrew-tap.
#
# Ship lives in a personal account by decision: the SHA pin keeps the code
# immutable, and availability depends on that account.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string
      skip_semver_check:
        description: 'Skip semver ordering verification'
        type: boolean
        default: false
      skip_ci_checks:
        description: 'Skip CI check verification on HEAD'
        type: boolean
        default: false
      skip_unreleased_check:
        description: 'Skip unreleased commits verification'
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/go-release.yml@01e205c8897d54daac4d30b81710c695bfd1f31b # v0.10.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: '["Build and Test", "Standardized CI / Run linters"]'
      # Ship's default too; explicit so rc tags (vX.Y.Z-rc.N) keep working
      # if that default ever changes.
      allow_prerelease: true
      skip_semver_check: ${{ inputs.skip_semver_check }}
      skip_ci_checks: ${{ inputs.skip_ci_checks }}
      skip_unreleased_check: ${{ inputs.skip_unreleased_check }}
      tap: unbound-force/homebrew-tap
      # After each release: the cask as installed from the published tap.
      tap_install_check: '"$HOMEBREW_PREFIX/bin/replicator" --version'
    permissions:
      contents: write
      checks: read
      id-token: write
    # Mapped by name: inherited secrets don't reach a workflow in
    # another owner's repo.
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
