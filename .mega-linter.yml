# https://megalinter.io/latest/supported-linters/
# Keep style checks focused while security scanners inspect the full tree.
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|\.opencode|\.claude|\.uf|\.specify|dist)/'
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|\.opencode|\.claude|\.uf|\.specify|dist)/'
PROTOBUF_PROTOLINT_FILTER_REGEX_EXCLUDE: "(vendor/)"
ENABLE_LINTERS:
  - ACTION_ZIZMOR
  - ACTION_ACTIONLINT
  - ANSIBLE_ANSIBLE_LINT
  - BASH_SHELLCHECK
  - DOCKERFILE_HADOLINT
  - GO_GOLANGCI_LINT
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF
  - PROTOBUF_PROTOLINT
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_KICS
  - YAML_YAMLLINT
REPOSITORY_KICS_ARGUMENTS: "--fail-on high"
