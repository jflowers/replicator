# CI
# --
# Continuous integration pipeline. Runs on push to main and
# pull requests. A changes job detects whether a pull request
# touches files outside .uf/dewey/learnings/ and gates the
# expensive jobs; pushes to main always run everything. The
# CI OK aggregate fails when any needed job fails or is
# cancelled. Validates code quality (vet, govulncheck), runs
# tests with race detection, enforces per-package coverage
# ratchets, and verifies the binary builds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # Pushes never diff (see the push short-circuit below), so they
      # skip the checkout.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # On pull_request the checkout is refs/pull/N/merge; depth 2
          # fetches the merge commit and both of its parents.
          fetch-depth: 2

      - name: Detect code changes
        id: detect
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes to main always run full CI (CLS-FR-001).
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Push event — setting code=true unconditionally."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD is GitHub's merge of the PR head (HEAD^2) into the current
          # main (HEAD^1), so HEAD^1..HEAD is exactly what merging the PR
          # would change on main today. Unlike a diff against the event's
          # base SHA, it does not count main's own changes when
          # base.sha is older than the main merged into the branch.
          # Fail closed: anything unexpected fails the job rather than guessing.
          if ! PR_PARENT="$(git rev-parse --verify --quiet 'HEAD^2^{commit}')"; then
            echo "::error::HEAD is not the pull request merge commit — failing closed (CLS-FR-001)"
            exit 1
          fi
          if [ "$PR_PARENT" != "$HEAD_SHA" ]; then
            echo "::error::merge commit's second parent $PR_PARENT is not the PR head $HEAD_SHA — failing closed (CLS-FR-001)"
            exit 1
          fi
          if ! CHANGED_FILES="$(git diff --raw --no-renames 'HEAD^1' HEAD)"; then
            echo "::error::git diff of the pull request merge commit failed — failing closed (CLS-FR-001)"
            exit 1
          fi

          # Learnings-only means every change is a regular .md file under
          # .uf/dewey/learnings/ (added, edited or deleted), the same rule
          # as the sibling repos. --no-renames lists both sides of a
          # rename, so a file moved into learnings still counts its source
          # path. --raw adds file modes: symlinks (120000) and submodules
          # (160000) can point anywhere, so they count as code. An empty
          # diff, a path git had to quote, or a line that does not parse
          # also counts as code.
          code="false"
          reason=""
          if [ -z "$CHANGED_FILES" ]; then
            code="true"
            reason="no changed files"
          fi
          while IFS= read -r line; do
            [ "$code" = "true" ] && break
            [ -z "$line" ] && continue
            # ":<old mode> <new mode> <old sha> <new sha> <status><TAB><path>"
            meta="${line%%$'\t'*}"
            file="${line#*$'\t'}"
            if [ "$meta" = "$line" ] || [ "${meta#:}" = "$meta" ]; then
              code="true"
              reason="unparsable diff line: $line"
              break
            fi
            read -r old_mode new_mode _ <<< "${meta#:}"
            for mode in "$old_mode" "$new_mode"; do
              case "$mode" in
                000000|100644|100755) ;;
                *)
                  code="true"
                  reason="mode $mode (symlink or submodule): $file"
                  ;;
              esac
            done
            [ "$code" = "true" ] && break
            case "$file" in
              .uf/dewey/learnings/?*.md) ;;
              *)
                code="true"
                reason="not a .md file under .uf/dewey/learnings/: $file"
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$code" = "true" ]; then
            echo "Full CI required — $reason"
          else
            echo "All changed files are learnings under .uf/dewey/learnings/ — expensive jobs may skip."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@3e6f44f962742443c11ae2261f02e0c917aeb2bc  # v1.5.0
          govulncheck ./...

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          install-only: true
          distribution: goreleaser
          version: v2.18.2

      - name: Render Homebrew cask
        run: goreleaser release --snapshot --clean --skip=announce

      - name: Test Homebrew cask integrity patching
        run: .github/scripts/patch-homebrew-cask_test.sh dist/homebrew/Casks/replicator.rb

      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Enforce Coverage Ratchets
        run: |
          # Guard: coverage profile must exist and be non-empty
          if [ ! -s coverage.out ]; then
            echo "::error::No coverage profile found — cannot enforce ratchets"
            exit 1
          fi

          FAILED=0

          # --- Global coverage floor ---
          GLOBAL_COV=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print substr($3, 1, length($3)-1)}')
          if [ -z "$GLOBAL_COV" ]; then
            echo "::error::Could not parse global coverage from coverage.out"
            exit 1
          fi
          echo "Global coverage: ${GLOBAL_COV}%"
          if (( $(echo "$GLOBAL_COV < 55.0" | bc -l) )); then
            echo "::error::Global coverage ${GLOBAL_COV}% is below the 55% threshold."
            exit 1
          fi

          # --- Per-package coverage ratchets ---
          declare -A THRESHOLDS=(
            ["internal/memory"]=85
            ["internal/query"]=80
            ["internal/doctor"]=80
            ["internal/forge"]=80
            ["internal/stats"]=80
            ["internal/comms"]=80
            ["internal/org"]=80
            ["internal/agentkit"]=80
            ["internal/gitutil"]=80
            ["internal/ui"]=75
            ["internal/mcp"]=70
            ["internal/mcpclient"]=80
          )

          for PKG in "${!THRESHOLDS[@]}"; do
            THRESHOLD=${THRESHOLDS[$PKG]}
            PKG_COV=$(go tool cover -func=coverage.out \
              | grep "github.com/unbound-force/replicator/${PKG}" \
              | awk '{print substr($3, 1, length($3)-1)}' \
              | awk '{t+=$1; c++} END {if(c>0) printf "%.1f", t/c; else print "0.0"}')
            if (( $(echo "$PKG_COV < $THRESHOLD" | bc -l) )); then
              echo "::error::${PKG} coverage ${PKG_COV}% is below the ${THRESHOLD}% threshold."
              FAILED=1
            else
              echo "${PKG}: ${PKG_COV}% >= ${THRESHOLD}% ✓"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "All coverage ratchets passed."

      - name: Build
        run: go build -o bin/replicator ./cmd/replicator

  ci-ok:
    name: CI OK
    needs: [changes, build-and-test]
    # Always run, so a failed or cancelled job fails the check -- except
    # for a push run that was itself cancelled (superseded by a newer
    # push to main). That run is not a verdict, so the check is skipped
    # instead of leaving a red CI OK on main's history. Pull request runs
    # never skip it: a skipped job satisfies a required check, so a
    # cancelled PR run must fail.
    if: always() && !(github.event_name == 'push' && cancelled())
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A needed job failed or was cancelled — CI did not pass."
          exit 1

      - name: All needed jobs succeeded or were skipped
        run: echo "All needed jobs succeeded or were skipped."
